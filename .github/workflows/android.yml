name: Android build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", "shared/**"]
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # Le SDK Android est déjà installé sur les machines GitHub (ANDROID_HOME)
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: podial-debug-apk, path: android/app/build/outputs/apk/debug/*.apk }
