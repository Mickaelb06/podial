<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Podial Player Web</title>
<meta name="description" content="Podcasts and live radio in your browser. No account, no tracking: everything stays in your browser.">
<meta name="theme-color" content="#0b0914">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%238b5cf6'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%2314121c'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #0b0914; --bg2: #120f1f; --card: #191631; --card2: #221e3d; --text: #f4f2fb; --muted: #a9a4c4;
  --violet: #8b5cf6; --pink: #ec4899; --cyan: #22d3ee; --line: rgba(255,255,255,.1); --glow: rgba(139,92,246,.4);
  --grad: linear-gradient(120deg, var(--violet), var(--pink)); --ease: cubic-bezier(.2,.7,.2,1);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root { --bg: #fbfaff; --bg2: #f3f0fd; --card: #fff; --card2: #f3f0fd; --text: #1b1829; --muted: #5d5877; --line: rgba(20,10,60,.1); --glow: rgba(139,92,246,.25); color-scheme: light; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.45; padding-bottom: 110px; -webkit-font-smoothing: antialiased;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif; }
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(520px circle at 8% -5%, rgba(139,92,246,.28), transparent 70%), radial-gradient(480px circle at 95% 0%, rgba(236,72,153,.2), transparent 70%); }
.i { width: 1.2em; height: 1.2em; flex: none; display: inline-block; vertical-align: -.2em; }
.cc { display: inline-grid; place-items: center; min-width: 28px; height: 19px; padding: 0 6px; border-radius: 6px; background: var(--grad); color: #fff; font-size: .66rem; font-weight: 800; letter-spacing: .04em; vertical-align: middle; margin-right: 6px; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
button, input, select { font: inherit; color: inherit; }
header { position: sticky; top: 10px; z-index: 10; margin: 10px auto 0; width: calc(100% - 24px); max-width: 1180px; border: 1px solid var(--line); border-radius: 99px;
  background: color-mix(in srgb, var(--bg) 66%, transparent); backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4); box-shadow: 0 10px 36px rgba(0,0,0,.18); }
.bar { padding: 0 10px 0 18px; display: flex; align-items: center; gap: 14px; height: 54px; }
.logo { font-weight: 900; font-size: 1.15rem; text-decoration: none; display: flex; align-items: center; gap: 9px; color: inherit; }
.logo i { width: 26px; height: 26px; border-radius: 50%; background: var(--grad); display: inline-block; position: relative; animation: spin 9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
.logo i::after { content: ""; position: absolute; inset: 8px; border-radius: 50%; background: var(--bg); }
.tabs { display: flex; gap: 4px; margin-left: auto; }
.tabs button { background: none; border: 0; padding: 8px 15px; border-radius: 99px; cursor: pointer; color: var(--muted); font-weight: 600; transition: background .2s, color .2s, box-shadow .2s; }
.tabs button:hover { color: var(--text); background: var(--card2); }
.tabs button[aria-selected="true"] { background: var(--grad); color: #fff; box-shadow: 0 6px 20px var(--glow); }
.layout { max-width: 1260px; margin: 0 auto; padding: 0 16px; display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 24px; align-items: start; }
main { min-width: 0; padding: 16px 0; }
aside { position: sticky; top: 84px; margin-top: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 20px; max-height: calc(100vh - 170px); overflow-y: auto; }
aside h3 { margin: 0 0 6px; font-size: 1.1rem; font-weight: 900; line-height: 1.25; }
aside h3 em { font-style: normal; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
aside p { margin: 0 0 12px; color: var(--muted); font-size: .88rem; }
aside .plat { display: block; margin-top: 12px; }
aside .plat > b { display: flex; align-items: center; gap: 8px; font-size: .9rem; margin-bottom: 6px; }
aside .plat > b i { font-style: normal; width: 26px; height: 26px; border-radius: 8px; background: var(--grad); color: #fff; display: grid; place-items: center; }
aside .plat > b i .i { width: 14px; height: 14px; }
aside .dl { display: flex; gap: 6px; flex-wrap: wrap; }
aside .dl a { border: 1px solid var(--line); border-radius: 99px; padding: 4px 12px; font-size: .82rem; text-decoration: none; color: inherit; background: var(--card2); }
aside .dl a:hover { border-color: var(--violet); }
aside .all { display: block; margin-top: 16px; font-size: .85rem; color: var(--muted); }
#sideclose { display: none; float: right; }
#menubtn { white-space: nowrap; }
#menubtn { display: none; background: var(--card2); border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px; cursor: pointer; font-weight: 600; font-size: .85rem; align-items: center; gap: 6px; }
@media (max-width: 900px) {
  .layout { display: block; }
  #menubtn { display: inline-flex; margin-left: auto; }
  #sideclose { display: inline-block; }
  .tabs { margin-left: 0; }
  aside { position: fixed; z-index: 40; left: 0; top: 0; bottom: 0; width: min(320px, 88vw); max-height: none; margin: 0; border-radius: 0 18px 18px 0; transform: translateX(-105%); transition: transform .2s; }
  body.menu aside { transform: none; box-shadow: 0 0 0 100vmax rgba(0,0,0,.5); }
}
.tools { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.tools input[type=search] { flex: 1; min-width: 200px; padding: 12px 20px; border-radius: 99px; border: 1px solid var(--line); background: var(--card); transition: border-color .2s, box-shadow .2s; }
.tools input[type=search]:focus { outline: 0; border-color: var(--violet); box-shadow: 0 0 0 4px rgba(139,92,246,.2); }
.tools select { padding: 10px 14px; border-radius: 99px; border: 1px solid var(--line); background: var(--card); max-width: 220px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 8px; }
.chip { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 6px 15px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; transition: transform .2s var(--ease), border-color .2s, box-shadow .2s; }
.chip:hover { transform: translateY(-2px); border-color: rgba(139,92,246,.6); }
.chip .i { width: 1.05em; height: 1.05em; }
.chip[aria-pressed="true"] { background: var(--grad); border-color: transparent; color: #fff; box-shadow: 0 6px 18px var(--glow); }
h2 { margin: 18px 0 10px; font-size: 1.3rem; font-weight: 800; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
.grid .card { animation: rise .5s var(--ease) both; }
.card { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; border-radius: 18px; color: inherit; }
.card .cover { transition: transform .35s var(--ease), box-shadow .35s; box-shadow: 0 8px 22px rgba(0,0,0,.22); }
.card:hover .cover, .card:focus-visible .cover { transform: translateY(-5px) scale(1.02); box-shadow: 0 18px 40px rgba(0,0,0,.35), 0 0 0 2px var(--violet), 0 0 40px var(--glow); }
.cover { position: relative; aspect-ratio: 1; border-radius: 18px; overflow: hidden; display: grid; place-items: center;
  font-size: 2.4rem; font-weight: 900; color: #fff; }
.cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cover.logo-box { background: #fff; }
.cover.logo-box img { object-fit: contain; padding: 12%; }
.card .n { margin-top: 6px; font-weight: 700; font-size: .92rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .a { color: var(--muted); font-size: .8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rank { position: absolute; left: 6px; top: 6px; background: var(--grad); border-radius: 99px; padding: 0 9px; font-size: .85rem; font-weight: 800; }
.live { position: absolute; right: 6px; top: 6px; background: #e5484d; border-radius: 99px; padding: 0 8px; font-size: .65rem; font-weight: 800; letter-spacing: .04em; }
.msg { text-align: center; color: var(--muted); padding: 48px 16px; }
.head { display: flex; gap: 18px; align-items: flex-start; margin-bottom: 14px; }
.head .cover { width: 130px; flex: none; }
.head h1 { margin: 0 0 4px; font-size: 1.5rem; font-weight: 900; }
.head p { margin: 0 0 10px; color: var(--muted); }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 9px 18px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; transition: transform .2s var(--ease), box-shadow .2s; }
.btn:hover { transform: translateY(-2px); }
.btn.primary { background: var(--grad); border: 0; color: #fff; box-shadow: 0 8px 24px var(--glow); }
.back { margin-bottom: 8px; }
.ep { display: flex; gap: 12px; align-items: center; padding: 10px 6px; border-bottom: 1px solid var(--line); }
.ep .t { flex: 1; min-width: 0; }
.ep .t b { display: block; }
.ep .t small { color: var(--muted); }
.ep .go { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--grad); color: #fff; cursor: pointer; display: grid; place-items: center; transition: transform .2s var(--ease), box-shadow .2s; }
.ep .go:hover { transform: scale(1.1); box-shadow: 0 6px 18px var(--glow); }
.ep .go .i { width: 17px; height: 17px; }
.ep.done .t { opacity: .55; }
#player { position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 20; max-width: 1100px; margin: 0 auto; background: color-mix(in srgb, var(--bg2) 78%, transparent); border: 1px solid var(--line); border-radius: 22px;
  backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4); box-shadow: 0 20px 60px rgba(0,0,0,.4), 0 0 60px var(--glow); padding: 10px 16px 10px; animation: rise .4s var(--ease); }
#player[hidden] { display: none; }
.pl { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.pl .cover { width: 46px; flex: none; border-radius: 12px; font-size: 1.2rem; }
.pl .info { flex: 1; min-width: 0; }
.pl .info b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pl .info small { color: var(--muted); }
.pl button { background: none; border: 0; cursor: pointer; font-size: .85rem; font-weight: 700; padding: 8px; border-radius: 50%; min-width: 38px; display: inline-flex; align-items: center; justify-content: center; gap: 2px; transition: background .2s, transform .2s var(--ease); }
.pl button:hover { background: var(--card2); }
.pl button .i { width: 18px; height: 18px; }
.pl #pp { background: var(--grad); color: #fff; width: 46px; height: 46px; box-shadow: 0 8px 22px var(--glow); }
.pl #pp:hover { transform: scale(1.08); }
.pl #pp .i { width: 20px; height: 20px; }
.seek { max-width: 1100px; margin: 6px auto 0; display: flex; gap: 10px; align-items: center; font-size: .75rem; color: var(--muted); }
.seek input { flex: 1; accent-color: var(--violet); }
#toast { position: fixed; left: 50%; bottom: 130px; transform: translateX(-50%); background: var(--card2); border: 1px solid var(--line);
  padding: 10px 18px; border-radius: 14px; box-shadow: 0 14px 40px rgba(0,0,0,.35); z-index: 30; max-width: 90vw; }
#toast[hidden] { display: none; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; } }
@media (max-width: 560px) { #menubtn .lbl { display: none; } .logo span { display: none; } .tabs button { padding: 8px 11px; } .head .cover { width: 100px; } }
footer { text-align: center; color: var(--muted); font-size: .8rem; padding: 24px 16px; }
footer a { color: inherit; }
</style>
</head>

    for (const g of genres) {
      const list = await itunes.top(g).catch(() => []);

  // tous les podcasts d'une radio ou d'un éditeur (identifiant d'éditeur iTunes), jusqu'à 200

  async sourceResults(src) {

  },

  // flashs d'info et journaux locaux : les podcasts « Actus du jour » des radios locales (ICI, Alouette, K6FM…)
  async local(cat) {

// Radios absentes de l'annuaire, avec le flux publié par la station. Même liste que Extras.kt et catalog.py : à garder identique.
const EXTRA_RADIOS = [
  { kind: "radio", id: "extra-rmc2", name: "RMC 2", artist: "Italia", art: "https://www.rmc2.net/wp-content/themes/rmc2-child/apple-icon-180x180.png",
    stream: "https://stream.rcs.revma.com/txdn8d324ucwv", homepage: "https://www.rmc2.net", country: "IT" },
];
const stationKey = n => n.normalize("NFKD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[\[(].*?[\])]/g, " ").replace(/\b(hd|sd|aac|mp3|\d+ ?k(bps)?|hq|lq)\b/g, " ").replace(/[^a-z0-9]+/g, "");

// Wikimedia refuse les miniatures de taille quelconque (« Use thumbnail steps ») : on demande 330 px, une taille standard
const fixLogo = u => u && u.includes("upload.wikimedia.org") && u.includes("/thumb/") ? u.replace(/\/((?:lang[a-z-]+-)?)\d+px-/, "/$1330px-") : u;

// France Bleu s'appelle « ici » depuis 2025 : l'annuaire garde l'ancien nom, on affiche le nouveau
const niceName = n => /^france bleu /i.test(n) ? "ici " + n.slice(12).trim() : n;
const stationItem = (s, stream) => ({ kind: "radio", id: s.stationuuid, name: niceName(s.name.trim()), artist: [s.state, s.country].filter(Boolean).join(", "),
  art: radioLogos[stationKey(s.name)] || fixLogo(s.favicon || ""), stream, homepage: s.homepage || "" });

const radioApi = {
  hosts: ["https://de1.api.radio-browser.info", "https://de2.api.radio-browser.info", "https://nl1.api.radio-browser.info", "https://at1.api.radio-browser.info"],
  async get(path) {
    let last; for (const host of this.hosts) { try { return await getJson(host + path); } catch (e) { last = e; } }
    throw last;
  },
  // même radio sous plusieurs noms (« FIP », « FIP (HD) »…) : on garde la première, avec le logo d'un doublon si elle n'en a pas
  collect(rows) {
    const byKey = new Map();
    for (const s of rows) {
      const stream = s.url_resolved || s.url, key = niceName(s.name.trim()).normalize("NFKD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[\[(].*?[\])]/g, " ").replace(/\b(hd|sd|aac|mp3|\d+ ?k(bps)?|hq|lq)\b/g, " ").replace(/[^a-z0-9]+/g, "");
      if (!key) continue;
      const known = byKey.get(key);
      if (known) { if (!known.art && s.favicon && !radioLogos[key]) known.art = fixLogo(s.favicon); continue; }
      if (!stream) continue;
      byKey.set(key, stationItem(s, stream));
    }
    return [...byKey.values()];
  },
  async stations(cc, name) {
    await logosP;
    let q = `/json/stations/search?hidebroken=true&order=clickcount&reverse=true&limit=120&countrycode=${cc}`;
    if (name) q += "&name=" + encodeURIComponent(name);
    let rows = await this.get(q);
    const rest = name && name.trim().match(/^ici\s+(.+)/i);   // « ici Provence » se cherche aussi sous son ancien nom « France Bleu Provence »
    if (rest) rows = rows.concat(await this.get(q.replace(/&name=.*$/, "") + "&name=" + encodeURIComponent("France Bleu " + rest[1])).catch(() => []));
    const out = this.collect(rows).slice(0, 60);
    const nq = name ? stationKey(name) : "";
    for (const { country: c, ...r } of EXTRA_RADIOS) {
      if (out.some(o => o.stream === r.stream || stationKey(o.name) === stationKey(r.name))) continue;
      if (nq ? stationKey(r.name).includes(nq) : c === cc) out.push(r);
    }

  },
  // radios d'un genre : une requête par étiquette et par nom de station, résultats réunis ; un thème sans pays (Noël, judaïsme…) cherche dans le monde entier
  async byGenre(cc, g) {
    await logosP;
    const scope = g.world ? "" : `&countrycode=${cc}`, base = `/json/stations/search?hidebroken=true&order=clickcount&reverse=true&limit=200${scope}`;
    const lists = await Promise.all([
      ...(g.tags || []).map(tg => this.get(`${base}&tag=${encodeURIComponent(tg)}&tagExact=true`).catch(() => [])),
      ...(g.names || []).map(async n => (await this.get(`${base}&name=${encodeURIComponent(n.trim())}`).catch(() => [])).filter(s => s.name.toLowerCase().includes(n.trim().toLowerCase())))]);
    return this.collect(lists.flat()).slice(0, 100);
  },
  // toutes les webradios d'une marque : les stations du pays dont le nom contient un des morceaux de nom
  async byBrand(b) {
    await logosP;

      const q = raw.trim(), rows = await this.get(`/json/stations/search?hidebroken=true&order=clickcount&reverse=true&limit=200&countrycode=${b.country}&name=${encodeURIComponent(q)}`).catch(() => []);
      return rows.filter(s => s.name.toLowerCase().includes(q.toLowerCase()));
    }));
    let out = this.collect(lists.flat()).slice(0, 200);
    // « ici » (ex-France Bleu) : la liste officielle des radios locales, par région et en https, passe devant
    const rc = b.regional ? await rcatP : null;
    if (rc?.ici?.length) {
      const mine = rc.ici.flatMap(r => r.stations.map(([name, slug]) => ({ kind: "radio", id: "ici-" + slug, name, artist: r.region, art: radioLogos[stationKey(name)] || b.logo || "",

      const keys = new Set(mine.map(m => stationKey(m.name)));

  },
  countries() { return this._countries ||= this.get("/json/countries?order=stationcount&reverse=true&hidebroken=true"); },
  // radio d'un lien partagé : les radios fournies d'abord, puis l'annuaire (par identifiant)
  async byId(id) {

  },
  // « Surprends-moi » : un pays au hasard (parmi ceux qui ont des radios), puis une radio au hasard
  async surprise() {
    const cs = (await this.countries()).filter(c => c.iso_3166_1 && c.stationcount >= 5);
    for (let i = 0; i < 6 && cs.length; i++) {
      const c = cs.splice(Math.floor(Math.random() * cs.length), 1)[0];

  },

const audio = document.getElementById("audio"), $ = id => document.getElementById(id);
let now = null, live = false;
const speeds = [1, 1.25, 1.5, 1.75, 2, 0.75]; let si = 0;
function play(media, startAt = 0) {
  now = media; live = media.live;
  audio.src = media.url; audio.playbackRate = speeds[si];
  if (startAt > 5) { audio.addEventListener("loadedmetadata", () => { audio.currentTime = startAt; }, { once: true }); toast(t("resumed")); }
  audio.play().catch(() => {});
  $("player").hidden = false; $("ptitle").textContent = media.title; $("psub").textContent = media.sub;
  $("pcover").replaceWith(Object.assign(cover({ name: media.sub || media.title, art: media.art }), { id: "pcover" }));
  $("seekrow").style.display = live ? "none" : ""; $("back").style.display = $("fwd").style.display = $("speed").style.display = live ? "none" : "";
  if ("mediaSession" in navigator) {

    navigator.mediaSession.setActionHandler("seekbackward", () => audio.currentTime -= 15);

}

      h("option", { value: c.iso_3166_1, selected: c.iso_3166_1 === state.cc }, `${c.name} (${c.stationcount})`)))).catch(() => {});
  }
  view.replaceChildren(tools);
  const chips = h("div");
  if (kind === "podcast") {
    const chip = (label, on, fn) => h("button", { class: "chip", "aria-pressed": String(on), onclick: () => { fn(); showBrowse(kind); } }, label);
    const staticChips = () => h("div", { class: "chips" }, [null, ...Object.keys(GENRES)].map(g => chip(g ? GENRES[g] : t("all"), state.genre === (g && +g), () => { state.genre = g && +g; })));
    chips.replaceChildren(staticChips());
    catalogP.then(cat => {
      if (!cat || state.source) return;
      const parentOf = id => { const g = cat.genres.find(x => x.id === id); return g ? (g.parent || g.id) : null; };
      const parent = state.genre ? parentOf(state.genre) : null;
      const row1 = h("div", { class: "chips" },
        chip(t("all"), !state.genre && !state.panel, () => { state.genre = null; state.panel = null; }),
        chip([ic("radio"), t("panel_radios")], state.panel === "radios", () => { state.panel = "radios"; state.genre = null; }),
        chip([ic("newspaper"), t("panel_local")], state.panel === "local", () => { state.panel = "local"; state.genre = null; }),
        ...cat.genres.filter(g => !g.parent).map(g => chip(gName(g), !state.panel && parent === g.id, () => { state.genre = g.id; state.panel = null; })));
      const kids = !state.panel && parent ? cat.genres.filter(g => g.parent === parent) : [];
      chips.replaceChildren(row1, ...(kids.length ? [h("div", { class: "chips" },
        chip(gName(cat.genres.find(g => g.id === parent)), state.genre === parent, () => { state.genre = parent; }),
        ...kids.map(g => chip(gName(g), state.genre === g.id, () => { state.genre = g.id; })))] : []));
    });
    if (state.source) view.append(h("button", { class: "btn back", onclick: () => { state.source = null; showBrowse(kind); } }, ic("arrowleft"), t("back") + " · " + state.source.name));
    else view.append(chips);
  }
  if (kind === "radio") {
    const rchip = (label, on, fn) => h("button", { class: "chip", "aria-pressed": String(on), onclick: () => { fn(); state.rsource = null; showBrowse(kind); } }, label);
    rcatP.then(rc => {
      if (!rc || state.q[idx].trim()) return;
      const top = state.rgenre ? parentRadioGenre(rc, state.rgenre) : null;
      const row1 = h("div", { class: "chips" },
        rchip(t("all"), !state.rgenre && !state.webradios, () => { state.rgenre = null; state.webradios = false; }),
        rchip([ic("antenna"), t("panel_webradios")], state.webradios, () => { state.webradios = true; state.rgenre = null; }),
        ...rc.genres.map(g => rchip(gName(g), !state.webradios && top?.id === g.id, () => { state.rgenre = g.id; state.webradios = false; })));
      const kids = !state.webradios && top ? top.children : [];
      chips.replaceChildren(row1, ...(kids.length ? [h("div", { class: "chips" },
        rchip(gName(top), state.rgenre === top.id, () => { state.rgenre = top.id; }),
        ...kids.map(g => rchip(gName(g), state.rgenre === g.id, () => { state.rgenre = g.id; })))] : []));
    });
    if (state.rsource) view.append(h("button", { class: "btn back", onclick: () => { state.rsource = null; showBrowse(kind); } }, ic("arrowleft"), t("back") + " · " + state.rsource.name));
    else view.append(chips);
  }
  view.append(results);
  let timer;
  input.addEventListener("input", () => { state.q[idx] = input.value; if (input.value.trim()) { state.panel = null; state.source = null; state.webradios = false; state.rsource = null; } clearTimeout(timer); timer = setTimeout(load, 450); });
  async function load() {
    const id = ++seq, q = state.q[idx].trim();
    results.replaceChildren(h("div", { class: "msg" }, "…"));
    try {
      const cat = kind === "podcast" ? await catalogP : null;
      const rc = kind === "radio" ? await rcatP : null;
      if (kind === "radio" && !q && state.webradios && !state.rsource) {
        // liste fixe : les marques de tous les pays, celui de la liste d'abord
        const groups = new Map();
        for (const b of rc ? rc.brands : []) groups.set(b.country, [...(groups.get(b.country) || []), b]);
        const first = state.cc.toUpperCase();
        const order = [...groups.keys()].sort((a, b) => (a === first ? 0 : 1) - (b === first ? 0 : 1) || regionName(a).localeCompare(regionName(b), UL));
        results.replaceChildren(...(order.length ? order.flatMap(cc => [h("h2", {}, ccBadge(cc), regionName(cc)),
          h("div", { class: "grid" }, groups.get(cc).map(b => h("button", { class: "card", onclick: () => { state.rsource = b; showBrowse(kind); } },
            cover({ name: b.name, art: b.logo || "" }, b.logo ? "logo-box" : ""), h("div", { class: "n" }, b.name))))]) : [h("div", { class: "msg" }, t("none"))]));
        return;
      }
      const genre = kind === "radio" && rc && state.rgenre && !q ? findRadioGenre(rc, state.rgenre) : null;
      if (kind === "podcast" && !q && state.panel === "radios" && !state.source && cat) {
        // liste fixe : les radios et éditeurs du pays de l'utilisateur d'abord, puis les autres pays
        const groups = new Map();
        for (const src of cat.sources) groups.set(src.country, [...(groups.get(src.country) || []), src]);
        const first = country.toUpperCase();
        const order = [...groups.keys()].sort((a, b) => (a === first ? 0 : 1) - (b === first ? 0 : 1) || regionName(a).localeCompare(regionName(b), UL));
        results.replaceChildren(...order.flatMap(cc => [h("h2", {}, ccBadge(cc), regionName(cc)),
          h("div", { class: "grid" }, groups.get(cc).map(src => h("button", { class: "card", onclick: () => { state.source = src; showBrowse(kind); } },
            cover({ name: src.name, art: "" }), h("div", { class: "n" }, src.name))))]));
        return;
      }
      const items = kind === "radio" ? (q ? await radioApi.stations(state.cc, q) : state.rsource ? await radioApi.byBrand(state.rsource)
          : genre ? await radioApi.byGenre(state.cc, genre) : await radioApi.stations(state.cc, ""))
        : kind !== "podcast" ? await radioApi.stations(state.cc, q)
        : q ? await itunes.search(q)
        : state.source ? await itunes.bySource(state.source)
        : state.panel === "local" && cat ? await itunes.local(cat)
        : await itunes.top(state.genre);
      if (id !== seq) return;
      const plain = !q && !state.panel && !state.source && !genre && !state.rsource;
      const head = plain ? (kind === "radio" ? t("top") + " · " + state.cc : t("top")) : genre ? gName(genre) : !q && state.rsource ? state.rsource.name : null;
      results.replaceChildren(...(items.length ? [head ? h("h2", {}, head) : null, grid(items, plain)].filter(Boolean) : [h("div", { class: "msg" }, t("none"))]));
    } catch { if (id === seq) results.replaceChildren(h("div", { class: "msg" }, t("failed"))); }
  }
  load();
}

function showLibrary() {
  const l = lib.list(), pods = l.filter(x => x.kind === "podcast"), rads = l.filter(x => x.kind === "radio");
  view.replaceChildren(...(l.length ? [pods.length ? [h("h2", {}, t("followed")), grid(pods)] : null, rads.length ? [h("h2", {}, t("favs")), grid(rads)] : null].flat()
    : [h("div", { class: "msg" }, t("empty"))]));
}

const playRadio = item => play({ url: item.stream, raw: item.stream, title: item.name, sub: item.artist, art: item.art, live: true });

// lien partagé : #r=<identifiant de radio> ou #p=<identifiant de podcast>
async function loadFromHash(hash = location.hash) {
  const m = hash.match(/^#([rp])=(.+)$/);
  if (!m) return;
  try {
    const item = m[1] === "r" ? await radioApi.byId(decodeURIComponent(m[2])) : await itunes.byId(decodeURIComponent(m[2]));
    if (item) { tab = m[1] === "r" ? 1 : 0; renderTabs(); detail = item; route(); } else toast(t("bad_link"));
  } catch { toast(t("bad_link")); }
}

function showDetail(item) {
  const star = h("button", { class: "btn" }), update = () => star.replaceChildren(ic(lib.has(item) ? "starfill" : "star"), t(item.kind === "radio" ? (lib.has(item) ? "unfav" : "fav") : (lib.has(item) ? "unfollow" : "follow")));
  star.onclick = () => { lib.toggle(item); update(); }; update();
  const shareBtn = item.id ? h("button", { class: "btn", onclick: async () => {
    const url = location.origin + location.pathname + "#" + (item.kind === "radio" ? "r" : "p") + "=" + encodeURIComponent(item.id);
    if (navigator.share) { try { await navigator.share({ title: item.name, url }); return; } catch (e) { if (e.name === "AbortError") return; } }
    try { await navigator.clipboard.writeText(url); toast(t("copied")); } catch { toast(url); }
  } }, ic("link"), t("share")) : null;
  const actions = h("div", { style: "display:flex;gap:8px;flex-wrap:wrap" });
  const head = h("div", { class: "head" }, cover(item, item.kind === "radio" ? "logo-box" : ""), h("div", {}, h("h1", {}, item.name), h("p", {}, item.artist), actions));
  const list = h("div");
  view.replaceChildren(h("button", { class: "btn back", onclick: () => history.state?.podial ? history.back() : (detail = null, route()) }, ic("arrowleft"), t("back")), head, list);
  if (item.kind === "radio") {
    actions.append(h("button", { class: "btn primary", onclick: () => playRadio(item) }, ic("playf"), t("play_live")), star, shareBtn);
    if (item.homepage) actions.append(h("a", { class: "btn", href: item.homepage, target: "_blank", rel: "noopener noreferrer", style: "text-decoration:none" }, ic("ext")));
    return;
  }
  actions.append(star, shareBtn);
  list.append(h("div", { class: "msg" }, "…"));
  itunes.episodes(item.id).then(eps => {
    if (!eps.length) { list.replaceChildren(h("div", { class: "msg" }, t("no_eps"), " ", h("a", { href: "../#download" }, t("get_app")))); return; }
    // tri par date et filtre « non terminés » (les téléchargements n'existent pas dans la version web)
    const st = { newest: true, flt: "all" }, bar = h("div"), body = h("div");
    const chip = (label, on, fn) => h("button", { class: "chip", "aria-pressed": String(on), onclick: () => { fn(); draw(); } }, label);
    const row = (e, done) => h("div", { class: "ep" + (done[e.url] ? " done" : "") },
      h("div", { class: "t" }, h("b", {}, e.title), h("small", {}, e.date + (e.secs ? " · " + Math.round(e.secs / 60) + " " + t("min") : ""))),
      h("button", { class: "go", "aria-label": "Play", onclick: () => play({ url: e.url, raw: e.url, title: e.title, sub: item.name, art: e.art || item.art }, pos.get(e.url)) }, ic("playf")));
    function draw() {
      const done = store.get("done", {});
      const shown = (st.flt === "unfinished" ? eps.filter(e => !done[e.url]) : eps.slice()).sort((x, y) => y.date.localeCompare(x.date));
      if (!st.newest) shown.reverse();
      bar.replaceChildren(
        h("div", { class: "chips" }, chip(t("ep_newest"), st.newest, () => { st.newest = true; }), chip(t("ep_oldest"), !st.newest, () => { st.newest = false; })),
        h("div", { class: "chips" }, chip(t("ep_all"), st.flt === "all", () => { st.flt = "all"; }), chip(t("ep_unfinished"), st.flt === "unfinished", () => { st.flt = "unfinished"; })));
      body.replaceChildren(...(shown.length ? shown.map(e => row(e, done)) : [h("div", { class: "msg" }, t("ep_none_filtered"))]));
    }
    list.replaceChildren(h("h2", {}, t("episodes")), bar, body);
    draw();
  }).catch(() => list.replaceChildren(h("div", { class: "msg" }, t("failed"))));
}

addEventListener("hashchange", () => {
